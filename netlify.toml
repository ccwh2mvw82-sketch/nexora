# Ce fichier n'est lu QUE si le site est hébergé sur Netlify.
# Le site est actuellement sur GitHub Pages, qui ignore ces en-têtes HTTP.
# Sur GitHub Pages, la politique "referrer" est assurée par la balise
# <meta name="referrer"> présente dans chaque page HTML.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"